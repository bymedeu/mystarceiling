name: quality
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    container: gcc:16.2.0-trixie
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Align checkout ownership with container user
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git ls-files -z > /dev/null
      - name: Native and Python dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv libgtest-dev libspdlog-dev zlib1g-dev libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.10.0'
      - name: Pinned tool setup
        run: |
          python3 -m venv .quality-venv
          .quality-venv/bin/pip install -r tools/quality/requirements.txt
          npm ci --prefix tools/quality --ignore-scripts
          echo "$PWD/.quality-venv/bin" >> "$GITHUB_PATH"
      - name: Build pinned official cppcheck
        run: |
          git clone https://github.com/cppcheck-opensource/cppcheck.git /tmp/cppcheck
          git -C /tmp/cppcheck checkout --detach a436ca35ed1887bee789765122b65ed2d7a7e045
          make -C /tmp/cppcheck -j2 CXXFLAGS=-O2
          echo /tmp/cppcheck >> "$GITHUB_PATH"
      - name: Conventional commits and PR title (real head)
        run: python tools/quality/ci_policy.py
      - name: Warning-free build and tests
        run: python tools/quality/check.py build-test
      - name: Physical function length and complexity
        run: python tools/quality/check.py complexity
      - name: Cppcheck
        run: python tools/quality/check.py cppcheck
      - name: Final format verification
        run: python tools/quality/check.py format
