# MSC adapter handles project cppcheck flags and full Lizard inventory.
# Native pre-commit selection. All tools are preinstalled, offline, system hooks.
exclude: '(^|/)(vendor|third_party|generated|build|_deps|node_modules|\.venv|\.quality-venv)/'
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        language: system
        entry: git-quality-format
        types_or: [c, c++]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        language: system
        entry: ruff format
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-check
        name: Ruff check
        language: system
        entry: ruff check
        types_or: [python, pyi]
        stages: [pre-push]
